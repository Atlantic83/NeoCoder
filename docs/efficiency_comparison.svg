    </linearGradient>
    <linearGradient id="neo47Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="claudePureGrad" x1="0%" y1="0%" x2="100%" y2="0%">
