  <text x="172.20" y="752" text-anchor="middle" class="label">Python</text>
  <text x="248.60" y="752" text-anchor="middle" class="label">Java</text>
  <text x="325.00" y="752" text-anchor="middle" class="label">JavaScript</text>
  <text x="401.40" y="752" text-anchor="middle" class="label">TypeScript</text>
  <text x="477.80" y="752" text-anchor="middle" class="label">C</text>
  <text x="554.20" y="752" text-anchor="middle" class="label">C++</text>
  <text x="630.60" y="752" text-anchor="middle" class="label">C#</text>
